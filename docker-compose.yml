services:
  generator:
    build:
      context: .
      dockerfile: services/generator/Dockerfile
      args:
        REINVENT4_REF: v4.8
        REINVENT_PROCESSOR: cpu
    environment:
      REINVENT_DEVICE: ${REINVENT_DEVICE:-cpu}
      REINVENT_MODEL_PATH: /models/mol2mol_medium_similarity.prior
      REINVENT_TIMEOUT_SECONDS: ${REINVENT_TIMEOUT_SECONDS:-900}
    ports:
      - "127.0.0.1:12000:12000"
    volumes:
      - ./models/reinvent:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12000/health', timeout=5)
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  admet-moo:
    build:
      context: .
      dockerfile: services/admet_moo/Dockerfile
      args:
        PYTORCH_VERSION: "2.13.0"
    environment:
      ADMET_NUM_WORKERS: ${ADMET_NUM_WORKERS:-0}
    ports:
      - "127.0.0.1:12001:12001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12001/health', timeout=30)
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 180s

  admet-ai:
    build:
      context: .
      dockerfile: services/admet_ai/Dockerfile
      args:
        PYTORCH_VERSION: "2.13.0"
    environment:
      ADMET_AI_PORT: 12007
      ADMET_QUEUE_COUNT: ${ADMET_QUEUE_COUNT:-1}
      ADMET_NUM_WORKERS: ${ADMET_NUM_WORKERS:-0}
      ADMET_MAX_BULK_SIZE: ${ADMET_MAX_BULK_SIZE:-10000}
    ports:
      - "127.0.0.1:12007:12007"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12007/health', timeout=30)
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 180s

  policy-scoring:
    build:
      context: .
      dockerfile: services/policy_scoring/Dockerfile
    ports:
      - "127.0.0.1:12003:12003"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12003/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  synthesizability:
    build:
      context: .
      dockerfile: services/synthesizability/Dockerfile
      args:
        RASCORE_REF: cb77db503ee5cbf0e8bb8963df6e5b76b3a94f06
    ports:
      - "127.0.0.1:12002:12002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12002/health', timeout=10)
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  binding:
    build:
      context: .
      dockerfile: services/binding/Dockerfile
    ports:
      - "127.0.0.1:12004:12004"
    volumes:
      - ./targets:/targets:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12004/health', timeout=10)
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  physchem:
    build:
      context: .
      dockerfile: services/physchem/Dockerfile
    ports:
      - "127.0.0.1:12005:12005"
    volumes:
      - ./config:/config:ro
      - ./targets:/targets:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12005/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  physics:
    build:
      context: .
      dockerfile: services/physics/Dockerfile
    ports:
      - "127.0.0.1:12006:12006"
    volumes:
      - ./results:/results:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12006/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      XFORGE_RESULTS_ROOT: /results
      XFORGE_RUN_NAME: ${XFORGE_RUN_NAME:-}
    volumes:
      - ./config:/config:ro
      - ./results:/results
    depends_on:
      generator:
        condition: service_healthy
      admet-moo:
        condition: service_healthy
      synthesizability:
        condition: service_healthy
      binding:
        condition: service_healthy
      policy-scoring:
        condition: service_healthy
      physchem:
        condition: service_healthy
      physics:
        condition: service_healthy
    restart: "no"

  visualizer:
    build:
      context: .
      dockerfile: services/visualizer/Dockerfile
    environment:
      XFORGE_RESULTS_ROOT: /results
    ports:
      - "127.0.0.1:12010:12010"
    volumes:
      - ./results:/results:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12010/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
