services:
  generator:
    build:
      context: .
      dockerfile: services/generator/Dockerfile
      args:
        REINVENT4_REF: v4.8
        REINVENT_PROCESSOR: cpu
    environment:
      REINVENT_DEVICE: ${REINVENT_DEVICE:-cpu}
      REINVENT_MODEL_PATH: /models/mol2mol_medium_similarity.prior
      REINVENT_TIMEOUT_SECONDS: ${REINVENT_TIMEOUT_SECONDS:-900}
    ports:
      - "127.0.0.1:12000:12000"
    volumes:
      - ./models/reinvent:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12000/health', timeout=5)
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  admet-moo:
    build:
      context: .
      dockerfile: services/admet_moo/Dockerfile
      args:
        PYTORCH_VERSION: "2.13.0"
    environment:
      ADMET_NUM_WORKERS: ${ADMET_NUM_WORKERS:-0}
    ports:
      - "127.0.0.1:12001:12001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12001/health', timeout=30)
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 180s

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      XFORGE_RESULTS_ROOT: /results
      XFORGE_RUN_NAME: ${XFORGE_RUN_NAME:-}
    volumes:
      - ./config:/config:ro
      - ./results:/results
    depends_on:
      generator:
        condition: service_healthy
      admet-moo:
        condition: service_healthy
    restart: "no"

  visualizer:
    build:
      context: .
      dockerfile: services/visualizer/Dockerfile
    environment:
      XFORGE_RESULTS_ROOT: /results
    ports:
      - "127.0.0.1:12010:12010"
    volumes:
      - ./results:/results:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:12010/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
