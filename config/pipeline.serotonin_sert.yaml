# Six-iteration, physics-free integration run starting from serotonin and
# docking in the crystallographic central substrate site of human SERT (7LIA).
# The Tier 0 affinity value is the local serotonin redocking score from this
# prepared receptor, not an experimental affinity or a validated SERT QSAR.
target: targets/serotonin_sert.yaml

iterations: 6
candidates_per_iteration: 50
top_k_feedback: 10

generator:
  strategy: multinomial
  temperature: 1.0
  random_seed: 901
  reward:
    service: policy_scoring
    pool_multiplier: 2
    parameters:
      affinity_training_set:
        - smiles: "NCCc1c[nH]c2ccc(O)cc12"
          value: -6.996
      affinity_k: 5
      affinity_similarity_power: 2.0
      min_composite_desirability: 0.05

pipeline:
  - synthesizability:
      power: -2
      rascore_weight: 1.0
      sascore_weight: 1.0
      sascore_best: 1.0
      sascore_worst: 10.0
      gate_midpoint: 0.45
      gate_steepness: 8.0
      min_activation: 0.25
  - physchem:
      max_molecular_weight: 500
      max_clogp: 5.0
      max_hbond_donors: 5
      max_hbond_acceptors: 10
      max_tpsa: 140
      max_rotatable_bonds: 10
      min_formal_charge: -1
      max_formal_charge: 1
      min_heavy_atoms: 5
      max_heavy_atoms: 60
      allow_covalent_warheads: false
      require_pka_prediction: false
      require_retrosynthesis: false
  - admet_screen:
      min_log_s: -5.0
      max_microsomal_clint: 100.0
      # ADMET-AI Caco2_Wang is log10(Papp in cm/s); -6 is 10^-6 cm/s.
      min_log_papp: -6.0
      max_pgp_risk: 0.75
      max_herg_risk: 0.75
      max_cyp_risk: 0.75
      max_candidates: 15
  - binding:
      receptor_pdbqt: /targets/sert_7lia/7lia_chain_a_receptor.pdbqt
      receptor_pdb: /targets/sert_7lia/7lia_chain_a_prepared.pdb
      box_center: [123.384, 128.911, 137.778]
      box_size: [24.0, 24.0, 24.0]
      exhaustiveness: 4
      num_poses: 3
      energy_range: 3.0
      cpu: 1
      random_seed: 901
      conformer_count: 10
      conformer_prune_rms_angstrom: 0.5
      # The redocked serotonin control scores 13.41 kcal/mol with this
      # approximate MMFF/UFF strain calculation.
      max_internal_strain_kcal_mol: 15.0
      max_vina_score: -4.0
      min_ligand_efficiency: 0.10
      critical_interactions: []

admet_moo:
  properties:
    - docking_affinity
    - aqueous_solubility
    - metabolic_clearance
    - herg_blocking
    - bioavailability
  selection:
    method: nsga3
    nsga3_reference_partitions: 4
    diversity:
      enabled: true
      tanimoto_distance_threshold: 0.4
      morgan_radius: 2
      fingerprint_bits: 2048

http:
  timeout_seconds: 2400
  max_attempts: 8
  backoff_seconds: 1
