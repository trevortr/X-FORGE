# Fast oral-like 2D funnel. The amide product template is a deliberately simple
# reaction-viability example, not a complete retrosynthesis.
target: ../targets/example_target.yaml

iterations: 3
candidates_per_iteration: 50
top_k_feedback: 8

generator:
  strategy: multinomial
  temperature: 1.1
  random_seed: 404

pipeline:
  - physchem:
      max_molecular_weight: 500
      max_clogp: 5.0
      max_hbond_donors: 5
      max_hbond_acceptors: 10
      max_tpsa: 140
      max_rotatable_bonds: 10
      min_formal_charge: -1
      max_formal_charge: 1
      min_heavy_atoms: 5
      max_heavy_atoms: 60
      allow_covalent_warheads: false
      require_pka_prediction: false
      require_retrosynthesis: true
      reaction_templates:
        - "[#6:1](=[O:2])-[#8:3].[#7:4]>>[#6:1](=[O:2])-[#7:4]"

admet_moo:
  properties: null
  selection:
    method: desirability

http:
  timeout_seconds: 900
  max_attempts: 5
  backoff_seconds: 1
