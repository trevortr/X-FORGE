# Covalent-project variant: reactive/soft warheads are recorded but do not
# reject candidates. All other PAINS/Brenk and physicochemical gates remain.
target: ../targets/example_target.yaml

iterations: 3
candidates_per_iteration: 40
top_k_feedback: 6

generator:
  strategy: multinomial
  temperature: 1.25
  random_seed: 505

pipeline:
  - physchem:
      max_molecular_weight: 550
      max_clogp: 5.5
      max_hbond_donors: 6
      max_hbond_acceptors: 11
      max_tpsa: 160
      max_rotatable_bonds: 12
      min_formal_charge: -1
      max_formal_charge: 1
      min_heavy_atoms: 5
      max_heavy_atoms: 75
      allow_covalent_warheads: true
      additional_warhead_smarts:
        - "[C;H2]=[C;H]-[C](=O)-N"
      require_pka_prediction: false
      require_retrosynthesis: false

admet_moo:
  properties: null
  selection:
    method: desirability
    weights:
      dili: 2.0
      herg_blocking: 2.0

http:
  timeout_seconds: 900
  max_attempts: 5
  backoff_seconds: 1
